# ============================================================================
# Shared art-frame pipeline — wake, fetch the next image from HA, render, sleep.
# ============================================================================
# Device-agnostic behaviour. Everything a particular panel cares about arrives
# through substitutions defined in the device file:
#   ${ha_url} ${image_dir} ${manifest_file} ${image_file}
#   ${run_duration} ${sleep_duration} ${wake_hours} ${timezone}
#
# `wake_hours` is the refresh schedule: a comma-separated, ASCENDING list of
# local hours (e.g. `"6, 12, 18"`) the frame should show the next image at.
# Leave it empty (`""`) to keep the fixed `${sleep_duration}` cadence.
#
# CONTRACT: the device file must supply a `display:` block whose id is
# `epaper_display`. The `display:` block stays in the device file because the
# platform, model, pins and dimensions differ per panel, and ESPHome's list
# merging makes a partially-overridden `display:` list fragile.
# ============================================================================

esphome:
  # `name`/`friendly_name` are REQUIRED inside the esphome block itself, so they
  # are set here from substitutions the device file must define. A package cannot
  # contribute only `on_boot` -- validation runs per file and fails with
  # "'name' is a required option for [esphome]".
  # CONTRACT: the device file defines ${device_name} and ${friendly_name}.
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - wait_until:
          condition:
            wifi.connected:
      - script.execute: fetch_manifest

# Wake cycle. `run_duration` is a BACKSTOP only: the pipeline calls
# deep_sleep.enter as soon as the render completes, so power is never cut
# mid-refresh. This timer just guarantees sleep if a fetch fails before reaching
# that call.
deep_sleep:
  id: deep_sleep_1
  run_duration: ${run_duration}
  sleep_duration: ${sleep_duration}

# Wall clock, used to sleep to the next `${wake_hours}` slot instead of a fixed
# duration. SNTP rather than Home Assistant's clock: HA's API client is not
# reliably connected inside this ~1 min wake window, and `request_time()` is
# answered by whichever client is connected first (an `esphome logs` session
# wins over HA), so the schedule silently fell back to the fixed duration. SNTP
# syncs within a second of WiFi coming up, before the render even starts.
# Without a synced clock the pipeline falls back to `${sleep_duration}`.
time:
  - platform: sntp
    id: wall_clock
    timezone: ${timezone}

http_request:

globals:
  # Round-robin position, persisted across deep-sleep reboots (flash Preferences).
  - id: art_index
    type: int
    restore_value: true
    initial_value: "0"
  - id: art_count
    type: int
    restore_value: false
    initial_value: "0"
  - id: art_list
    type: std::vector<std::string>
    restore_value: false
  # Rotation direction for the current wake: +1 = next (the default, set at
  # construction on every boot), -1 = previous (set by a device's ext1 on_wake
  # trigger before the fetch runs). Never restored — a fresh boot always starts
  # at +1, so a timer wake shows the next image exactly as before.
  - id: art_direction
    type: int
    restore_value: false
    initial_value: "1"

script:
  - id: fetch_manifest
    then:
      - http_request.get:
          url: "${ha_url}/${image_dir}/${manifest_file}"
          on_response:
            then:
              - lambda: |-
                  id(art_list).clear();
                  id(art_count) = 0;
                  if (response->status_code != 200) {
                    ESP_LOGW("art", "manifest HTTP status %d", response->status_code);
                    return;
                  }
                  std::string body;
                  uint8_t buf[128];
                  int r;
                  while ((r = response->read(buf, sizeof(buf))) > 0)
                    body.append(reinterpret_cast<char *>(buf), r);
                  // Naive parse of a flat JSON array of strings: collect quoted runs.
                  std::string cur;
                  bool in_str = false;
                  for (char c : body) {
                    if (c == '"') {
                      if (in_str && !cur.empty())
                        id(art_list).push_back(cur);
                      cur.clear();
                      in_str = !in_str;
                    } else if (in_str) {
                      cur += c;
                    }
                  }
                  id(art_count) = (int) id(art_list).size();
                  ESP_LOGI("art", "manifest: %d image(s)", id(art_count));
              - script.execute: show_image

  - id: show_image
    then:
      - lambda: |-
          if (id(art_count) <= 0) {
            ESP_LOGW("art", "no images in manifest; nothing to show");
            return;
          }
          int c = id(art_count);
          // art_index always holds the index of the NEXT image to show.
          int i = ((id(art_index) % c) + c) % c;
          // Backward: show the image before the last one shown (art_index - 2),
          // then leave art_index one step back.
          if (id(art_direction) < 0)
            i = ((i - 2) % c + c) % c;
          std::string url = std::string("${ha_url}/${image_dir}/") + id(art_list)[i];
          ESP_LOGI("art", "showing %d/%d (dir %d): %s", i + 1, c, id(art_direction), url.c_str());
          id(art_image).set_url(url);
          id(art_image).update();
          id(last_image).publish_state(id(art_list)[i]);
          id(art_index) = ((i + 1) % c + c) % c;

  # Sleep until the next scheduled refresh, then the frame wakes and repeats.
  # Schedule beats duration: if `${wake_hours}` lists hours and the clock has
  # synced, sleep exactly to the next one. Otherwise (no schedule, or no synced
  # clock) sleep the fixed `${sleep_duration}` — a retry sooner than a day, so
  # one failed wake does not skip a whole day.
  - id: go_to_sleep
    then:
      - if:
          condition:
            lambda: |-
              const std::initializer_list<int> hours = {${wake_hours}};
              return hours.size() > 0 && id(wall_clock).now().is_valid();
          then:
            - deep_sleep.enter:
                id: deep_sleep_1
                sleep_duration: !lambda |-
                  // Hours are ascending: the next slot is the first one still
                  // ahead of us; after today's last slot, tomorrow's first.
                  const std::initializer_list<int> hours = {${wake_hours}};
                  const auto now = id(wall_clock).now();
                  const int now_s = now.hour * 3600 + now.minute * 60 + now.second;
                  int first_h = -1, next_s = -1;
                  for (int h : hours) {
                    if (first_h < 0) first_h = h;
                    if (next_s < 0 && h * 3600 > now_s) next_s = h * 3600;
                  }
                  if (next_s < 0) next_s = first_h * 3600 + 24 * 3600;
                  ESP_LOGI("art", "next refresh in %d s", next_s - now_s);
                  return (uint32_t) (next_s - now_s) * 1000;
          else:
            - deep_sleep.enter: deep_sleep_1

image:
  - platform: online_image
    id: art_image
    format: AUTO
    type: RGB565
    url: "${ha_url}/${image_dir}/${image_file}"
    buffer_size: 65536
    update_interval: never
    on_download_finished:
      - logger.log: "Image downloaded; drawing"
      # component.update runs the draw + full panel refresh synchronously, so the
      # panel is fully written when this returns. Only then is it safe to power
      # down — never cut power mid-refresh (that leaves a partial frame / stuck
      # panel).
      - component.update: epaper_display
      # The refresh above blocks the main loop, so the API (Home Assistant)
      # cannot connect while it runs — and we sleep immediately after. Hold the
      # device awake briefly (bounded) so HA can reconnect and read the sensors
      # before the long sleep; the timeout guarantees we never stay awake forever.
      - wait_until:
          condition:
            api.connected:
          timeout: 30s
      - delay: 5s
      - script.execute: go_to_sleep
    on_error:
      - logger.log: "Image download failed; sleeping"
      - script.execute: go_to_sleep

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"

text_sensor:
  - platform: template
    id: last_image
    name: "Last image"
