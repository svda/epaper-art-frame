# ============================================================================
# Bench device — full pipeline on the Heemol ESP32-S3 N16R8, USB-powered
# ============================================================================
# Goal: WiFi -> fetch an image from Home Assistant (/local/epaper) -> render it
# on the Waveshare 5.65" Module (F).
#
# Deliberately NOT yet included: deep sleep (USB-powered), battery/ADC, the
# manifest + round-robin cycle. Add those once this path works.
#
# WIRING (module header -> Heemol):
#   VCC -> 3V3   GND -> GND   DIN -> GPIO11   CLK -> GPIO12
#   CS  -> GPIO10  DC -> GPIO9  RST -> GPIO8   BUSY -> GPIO7 (INVERTED)
#
# Put a colour image at  <ha>/local/epaper/<image_file>  before flashing.
# ============================================================================

substitutions:
  device_name: epaper-bench
  friendly_name: E-Paper Bench
  # Home Assistant base URL serving config/www/epaper as /local/epaper
  ha_url: "http://homeassistant.local:8123"
  image_dir: "local/epaper"
  image_file: "test.png"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - wait_until:
          condition:
            wifi.connected:
      - component.update: art_image

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  flash_mode: qio
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

http_request:

image:
  - platform: online_image
    id: art_image
    format: AUTO
    type: RGB565
    url: "${ha_url}/${image_dir}/${image_file}"
    buffer_size: 65536
    update_interval: never
    on_download_finished:
      - logger.log: "Image downloaded; drawing"
      - component.update: epaper_display
    on_error:
      - logger.log: "Image download failed"

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 5.65in-f
    cs_pin: GPIO10
    dc_pin: GPIO9
    reset_pin: GPIO8
    # Q3: this panel's BUSY is active-LOW (bench-verified).
    busy_pin:
      number: GPIO7
      inverted: true
    update_interval: never
    lambda: |-
      it.fill(Color(255, 255, 255));
      it.image(0, 0, id(art_image));
