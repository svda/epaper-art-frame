# ============================================================================
# Bench device — full pipeline on the Heemol ESP32-S3 N16R8, USB-powered
# ============================================================================
# WiFi -> fetch manifest.json from Home Assistant -> pick the next image
# (round-robin, persisted) -> fetch it -> render on the 5.65" Module (F).
#
# Deliberately NOT included yet: deep sleep and battery/ADC (USB-powered).
#
# WIRING (module header -> NULA):
#   VCC -> 3V3   GND -> GND   DIN -> GPIO11   CLK -> GPIO12
#   CS  -> GPIO10  DC -> GPIO5  RST -> GPIO6   BUSY -> GPIO7 (INVERTED)
#   (DC/RST moved off GPIO9/GPIO8 — those are Qwiic I2C, shared with the RTC.)
#
# On Home Assistant, put in config/www/epaper/:
#   - manifest.json : a JSON array of filenames, e.g. ["a.png","b.png"]
#   - the images referenced by it
# ============================================================================

substitutions:
  device_name: epaper-bench
  friendly_name: E-Paper Bench
  ha_url: "http://server:8123"
  image_dir: "local/epaper"
  manifest_file: "manifest.json"
  # Default/placeholder image (the manifest overrides it at runtime)
  image_file: "test.png"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - wait_until:
          condition:
            wifi.connected:
      - script.execute: fetch_manifest

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  flash_mode: qio
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

http_request:

globals:
  # Round-robin position, persisted across restarts/deep sleep
  - id: art_index
    type: int
    restore_value: true
    initial_value: "0"
  - id: art_count
    type: int
    restore_value: false
    initial_value: "0"
  - id: art_list
    type: std::vector<std::string>
    restore_value: false

script:
  - id: fetch_manifest
    then:
      - http_request.get:
          url: "${ha_url}/${image_dir}/${manifest_file}"
          on_response:
            then:
              - lambda: |-
                  id(art_list).clear();
                  id(art_count) = 0;
                  if (response->status_code != 200) {
                    ESP_LOGW("art", "manifest HTTP status %d", response->status_code);
                    return;
                  }
                  std::string body;
                  uint8_t buf[128];
                  int r;
                  while ((r = response->read(buf, sizeof(buf))) > 0)
                    body.append(reinterpret_cast<char *>(buf), r);
                  // Naive parse of a flat JSON array of strings: collect quoted runs.
                  std::string cur;
                  bool in_str = false;
                  for (char c : body) {
                    if (c == '"') {
                      if (in_str && !cur.empty())
                        id(art_list).push_back(cur);
                      cur.clear();
                      in_str = !in_str;
                    } else if (in_str) {
                      cur += c;
                    }
                  }
                  id(art_count) = (int) id(art_list).size();
                  ESP_LOGI("art", "manifest: %d image(s)", id(art_count));
              - script.execute: show_next_image

  - id: show_next_image
    then:
      - lambda: |-
          if (id(art_count) <= 0) {
            ESP_LOGW("art", "no images in manifest; nothing to show");
            return;
          }
          int i = id(art_index) % id(art_count);
          std::string url = std::string("${ha_url}/${image_dir}/") + id(art_list)[i];
          ESP_LOGI("art", "showing %d/%d: %s", i + 1, id(art_count), url.c_str());
          id(art_image).set_url(url);
          id(art_image).update();
          id(art_index) = (i + 1) % id(art_count);

image:
  - platform: online_image
    id: art_image
    format: AUTO
    type: RGB565
    url: "${ha_url}/${image_dir}/${image_file}"
    buffer_size: 65536
    update_interval: never
    on_download_finished:
      - logger.log: "Image downloaded; drawing"
      - component.update: epaper_display
    on_error:
      - logger.log: "Image download failed"

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 5.65in-f
    cs_pin: GPIO10
    dc_pin: GPIO5
    reset_pin: GPIO6
    # Q3: this panel's BUSY is active-LOW (bench-verified).
    busy_pin:
      number: GPIO7
      inverted: true
    update_interval: never
    lambda: |-
      it.fill(Color(255, 255, 255));
      it.image(0, 0, id(art_image));
