# ============================================================================
# E-Paper Art Frame — device config
# ============================================================================
# Panel: Waveshare 5.65" 7-colour ACeP e-paper, 600x448, 4-wire SPI
# Driver: stock ESPHome `waveshare_epaper`, model `5.65in-f` (>= 2026.9.0).
#         No custom/external component (SPEC Revision 2).
#
# PIN MAP  (single source of truth — P0.2; CONFIRMED vs NULA Arduino board variant)
#   SPI CLK   -> GPIO12   (FSPICLK / default SCK)
#   SPI MOSI  -> GPIO11   (FSPID / default MOSI)
#   EPD CS    -> GPIO10   (FSPICS0 / default SS)
#   EPD DC    -> GPIO5    (was GPIO9 — collides with Qwiic SCL / onboard RTC)
#   EPD RST   -> GPIO6    (was GPIO8 — collides with Qwiic SDA / onboard RTC)
#   EPD BUSY  -> GPIO7    (inverted: true — panel BUSY is active-LOW)
#   BAT ADC   -> GPIO4    (ADC1_CH3; NULA has NO battery divider -> wire one)
#   Qwiic/I2C is SDA=GPIO8, SCL=GPIO9 (shared with the PCF85063A RTC) — keep clear.
#
# BOARD (P0.2, Rev 4): Soldered **NULA DeepSleep ESP32-S3** — amazon.nl
#   B0FZDDH33Y / soldered.com 333352. ESP32-S3-WROOM-1-N8R8 (8 MB flash +
#   8 MB PSRAM), onboard TP4056M LiPo charger + PCF85063A RTC.
#   Vendor deep-sleep claim: 7 uA (chip-level; requires all peripherals off and
#   JP1 OPEN to disconnect the WS2812B LED). PSRAM CONFIRMED 8 MB (esptool
#   "Embedded PSRAM 8MB" + ESPHome "Size: 8192 KB", 2026-10-02).
#   Logger console is USB_SERIAL_JTAG, not the CH340 — use the network API for
#   logs (`esphome logs --device epaper-art-frame.local`).
#
# POWER & BATTERY (P0.3, Rev 4): 3000 mAh single-cell LiPo via the NULA's onboard
#   JST connector + TP4056M charger (no separate TP4056 module needed).
#
# P1.1 scope: full device config — deep sleep + fetch/render + sensors.
#   NOTE: sleep_duration is 5min for bench bring-up so rotation can be observed
#   quickly. Set it to 24h for deployment (the SPEC cadence).
# ============================================================================

substitutions:
  device_name: epaper-art-frame
  friendly_name: E-Paper Art Frame

  # Image source — HA serves www/ at /local/... . Use the HA host DNS name
  # (`server`); mDNS names do not resolve from the ESP (see bench notes).
  ha_url: "http://server:8123"
  image_dir: "local/epaper"
  manifest_file: "manifest.json"
  image_file: "test.png"

  # Pin map — see header. Confirmed vs NULA Arduino board variant (Qwiic 8/9).
  clk_pin: GPIO12
  mosi_pin: GPIO11
  cs_pin: GPIO10
  dc_pin: GPIO5
  reset_pin: GPIO6
  busy_pin: GPIO7

  # Wake cycle. Bench: 1h to observe rotation without hammering the AP.
  # Deploy: 24h (the SPEC cadence).
  # run_duration is a BACKSTOP only: the pipeline calls deep_sleep.enter as soon
  # as the render completes, so power is never cut mid-refresh. This timer just
  # guarantees sleep if a fetch fails before reaching that call.
  run_duration: 180s
  sleep_duration: 1h

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - wait_until:
          condition:
            wifi.connected:
      - script.execute: fetch_manifest

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  # WROOM-1 N8R8 = Quad flash + Octal PSRAM -> QIO flash. The DIO default
  # crashed in esp_psram_extram_test at boot; QIO fixes it.
  flash_mode: qio
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

captive_portal:

deep_sleep:
  id: deep_sleep_1
  run_duration: ${run_duration}
  sleep_duration: ${sleep_duration}

http_request:

globals:
  # Round-robin position, persisted across deep-sleep reboots (flash Preferences).
  - id: art_index
    type: int
    restore_value: true
    initial_value: "0"
  - id: art_count
    type: int
    restore_value: false
    initial_value: "0"
  - id: art_list
    type: std::vector<std::string>
    restore_value: false

script:
  - id: fetch_manifest
    then:
      - http_request.get:
          url: "${ha_url}/${image_dir}/${manifest_file}"
          on_response:
            then:
              - lambda: |-
                  id(art_list).clear();
                  id(art_count) = 0;
                  if (response->status_code != 200) {
                    ESP_LOGW("art", "manifest HTTP status %d", response->status_code);
                    return;
                  }
                  std::string body;
                  uint8_t buf[128];
                  int r;
                  while ((r = response->read(buf, sizeof(buf))) > 0)
                    body.append(reinterpret_cast<char *>(buf), r);
                  // Naive parse of a flat JSON array of strings: collect quoted runs.
                  std::string cur;
                  bool in_str = false;
                  for (char c : body) {
                    if (c == '"') {
                      if (in_str && !cur.empty())
                        id(art_list).push_back(cur);
                      cur.clear();
                      in_str = !in_str;
                    } else if (in_str) {
                      cur += c;
                    }
                  }
                  id(art_count) = (int) id(art_list).size();
                  ESP_LOGI("art", "manifest: %d image(s)", id(art_count));
              - script.execute: show_next_image

  - id: show_next_image
    then:
      - lambda: |-
          if (id(art_count) <= 0) {
            ESP_LOGW("art", "no images in manifest; nothing to show");
            return;
          }
          int i = id(art_index) % id(art_count);
          std::string url = std::string("${ha_url}/${image_dir}/") + id(art_list)[i];
          ESP_LOGI("art", "showing %d/%d: %s", i + 1, id(art_count), url.c_str());
          id(art_image).set_url(url);
          id(art_image).update();
          id(last_image).publish_state(id(art_list)[i]);
          id(art_index) = (i + 1) % id(art_count);

image:
  - platform: online_image
    id: art_image
    format: AUTO
    type: RGB565
    url: "${ha_url}/${image_dir}/${image_file}"
    buffer_size: 65536
    update_interval: never
    on_download_finished:
      - logger.log: "Image downloaded; drawing"
      # component.update runs the draw + full panel refresh synchronously
      # (WaveshareEPaperBase::update -> do_update_ + display), so the panel is
      # fully written when this returns. Only then is it safe to power down —
      # never cut power mid-refresh (that leaves a partial frame / stuck panel).
      - component.update: epaper_display
      # The refresh above blocks the main loop ~30 s, so the API (Home Assistant)
      # cannot connect while it runs — and we sleep immediately after. Hold the
      # device awake briefly (bounded) so HA can reconnect and read the sensors
      # before the long sleep; the timeout guarantees we never stay awake forever.
      - wait_until:
          condition:
            api.connected:
          timeout: 30s
      - delay: 5s
      - deep_sleep.enter: deep_sleep_1
    on_error:
      - logger.log: "Image download failed; sleeping"
      - deep_sleep.enter: deep_sleep_1

spi:
  clk_pin: ${clk_pin}
  mosi_pin: ${mosi_pin}

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 5.65in-f
    cs_pin: ${cs_pin}
    dc_pin: ${dc_pin}
    reset_pin: ${reset_pin}
    # Q3 RESOLVED (bench 2026-09-28): this panel's BUSY is active-LOW — ESPHome
    # must invert it. Without inversion the driver times out waiting for IDLE.
    busy_pin:
      number: ${busy_pin}
      inverted: true
    # Drawn by the on_download_finished handler when a new image arrives.
    update_interval: never
    lambda: |-
      it.fill(Color(255, 255, 255));
      it.image(0, 0, id(art_image));

sensor:
  # Battery voltage — REQUIRES an external divider VBAT -> GPIO4 (P3.1); the NULA
  # has none. Disabled by default so HA does not record a floating reading until
  # the divider is fitted; adjust `multiply` to the fitted resistor ratio.
  - platform: adc
    pin: GPIO4
    id: battery_voltage
    name: "Battery voltage"
    attenuation: 12db
    update_interval: 60s
    disabled_by_default: true
    filters:
      - multiply: 2.0
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"

text_sensor:
  - platform: template
    id: last_image
    name: "Last image"
