# ============================================================================
# E-Paper Art Frame — device config
# ============================================================================
# Panel: Waveshare 5.65" 7-colour ACeP e-paper, 600x448, 4-wire SPI
# Driver: stock ESPHome `waveshare_epaper`, model `5.65in-f` (>= 2026.9.0).
#         No custom/external component (SPEC Revision 2).
#
# PIN MAP  (single source of truth — P0.2; PROVISIONAL, from NULA pinout v1.0.0)
#   SPI CLK   -> GPIO12   (FSPICLK)
#   SPI MOSI  -> GPIO11   (FSPID)
#   EPD CS    -> GPIO10   (FSPICS0)
#   EPD DC    -> GPIO9
#   EPD RST   -> GPIO8
#   EPD BUSY  -> GPIO7
#   BAT ADC   -> GPIO4    (ADC1_CH3; NULA has NO battery divider -> wire one)
#   Confirm these against the NULA pinout image / Qwiic I2C pins before wiring.
#
# BOARD (P0.2, Rev 4): Soldered **NULA DeepSleep ESP32-S3** — amazon.nl
#   B0FZDDH33Y / soldered.com 333352. Marketed as ESP32-S3-WROOM-1-N8R8
#   (8 MB flash + 8 MB PSRAM), onboard TP4056M LiPo charger + PCF85063A RTC.
#   Vendor deep-sleep claim: 7 uA (chip-level; requires all peripherals off and
#   JP1 OPEN to disconnect the WS2812B LED).
#   !! OPEN RISK: Soldered's own docs "Overview" page instead lists ESP32-S3FN8,
#      "8 MB Flash and 512 KB SRAM" (i.e. NO PSRAM). This project REQUIRES PSRAM
#      (~1.0 MB of 7-colour frame buffers vs 512 KB SRAM). VERIFY PSRAM on
#      arrival; if absent, re-target. See todo.md P0.2.
#   Sources: docs.soldered.com (hardware-details, overview); amazon.nl B0FZDDH33Y.
#
# POWER & BATTERY (P0.3, Rev 4): 3000 mAh single-cell LiPo via the NULA's onboard
#   JST connector + TP4056M charger (no separate TP4056 module needed).
#   Lifetime at the vendor 7 uA figure is battery-self-discharge bound (the
#   daily ~1 min wake is negligible), so the SPEC's 6-12 month target is met
#   with large margin. P3.1 must MEASURE the real figure — the 7 uA excludes
#   peripheral/LED leakage — and confirm JP1 is open for the lowest current.
#
# P0.1 scope: render a 7-colour test pattern on the bare panel from ESPHome.
# ============================================================================

substitutions:
  device_name: epaper-art-frame
  friendly_name: E-Paper Art Frame

  # Pin map — see header. PROVISIONAL (NULA pinout v1.0.0); confirm before wiring.
  clk_pin: GPIO12
  mosi_pin: GPIO11
  cs_pin: GPIO10
  dc_pin: GPIO9
  reset_pin: GPIO8
  busy_pin: GPIO7

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - delay: 2s
      - component.update: epaper_display

esp32:
  # Soldered NULA DeepSleep ESP32-S3 (ESP32-S3-WROOM-1-N8R8: 8 MB flash + 8 MB
  # PSRAM — PSRAM pending verification, see header RISK).
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: ${clk_pin}
  mosi_pin: ${mosi_pin}

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 5.65in-f
    cs_pin: ${cs_pin}
    dc_pin: ${dc_pin}
    reset_pin: ${reset_pin}
    busy_pin: ${busy_pin}
    # Rendered once from on_boot for the P0.1 bench test.
    update_interval: never
    lambda: |-
      const int W = 600;
      const int H = 448;

      // 7 ACeP565 colours, ordered to exercise every colour code in
      // waveshare_epaper's 7-colour path (0x0..0x6).
      const Color bars[7] = {
        Color(0, 0, 0),        // 0x0 black
        Color(0, 0, 255),      // 0x3 blue
        Color(0, 255, 0),      // 0x2 green
        Color(255, 255, 0),    // 0x5 yellow
        Color(255, 128, 0),    // 0x6 orange
        Color(255, 0, 0),      // 0x4 red
        Color(255, 255, 255),  // 0x1 white
      };

      it.fill(Color(255, 255, 255));

      // 7 vertical colour bars.
      const int bar_w = W / 7;
      for (int i = 0; i < 7; i++) {
        it.filled_rectangle(i * bar_w, 60, bar_w, 328, bars[i]);
      }

      // Geometry marks: full border, corner blocks, both diagonals.
      it.rectangle(0, 0, W, H, Color(0, 0, 0));
      it.filled_rectangle(0, 0, 24, 24, Color(0, 0, 0));
      it.filled_rectangle(W - 24, 0, 24, 24, Color(0, 0, 0));
      it.filled_rectangle(0, H - 24, 24, 24, Color(0, 0, 0));
      it.filled_rectangle(W - 24, H - 24, 24, 24, Color(0, 0, 0));
      it.line(0, 0, W - 1, H - 1, Color(0, 0, 0));
      it.line(W - 1, 0, 0, H - 1, Color(0, 0, 0));
