# ============================================================================
# E-Paper Art Frame — device config
# ============================================================================
# Panel: Waveshare 5.65" 7-colour ACeP e-paper, 600x448, 4-wire SPI
# Driver: stock ESPHome `waveshare_epaper`, model `5.65in-f` (>= 2026.9.0).
#         No custom/external component (SPEC Revision 2).
#
# PIN MAP  (single source of truth — P0.2)
#   SPI CLK   -> GPIO12
#   SPI MOSI  -> GPIO11
#   EPD CS    -> GPIO10
#   EPD DC    -> GPIO9
#   EPD RST   -> GPIO8
#   EPD BUSY  -> GPIO7
#   BAT ADC   -> GPIO4      (P1.1, via on-board divider; ADC1_CH3)
#
# BOARD (P0.2): Heemol ESP32-S3 N16R8 — an ESP32-S3-DevKitC-1 form-factor board
#   carrying an ESP32-S3-WROOM-1 module, 16 MB flash / 8 MB octal PSRAM.
#   Deep-sleep quiescent (CITED, not measured): **5-15 mA** for a stock
#   ESP32-S3-DevKitC-1 class board — the AMS1117-3.3 LDO (~5 mA always-on),
#   the CP2102N USB-UART bridge (2-5 mA) and the power LED (2-3 mA); the
#   ESP32-S3 chip itself is ~7 uA (datasheet v1.6 section 4.7).
#   Source: hubble.com/community/guides/esp32-deep-sleep-current-...
#   To be measured on the bench in P3.1.
#
# POWER & BATTERY (P0.3): 3000 mAh single-cell LiPo + TP4056 charger.
#   Lifetime re-derived from the P0.2 BOARD quiescent (not the ~7 uA chip spec):
#     3000 mAh / 15 mA  ~= 200 h  ~= 8 days    (stock DevKitC-1 class, worst)
#     3000 mAh / 10 mA  ~= 300 h  ~= 12.5 days (typical dev-board figure)
#     3000 mAh / 5 mA   ~= 600 h  ~= 25 days   (best case, stock)
#   With the dev-board parasitics designed out (~50-200 uA low-Iq path):
#     3000 mAh / 0.1 mA ~= 3.4 years.
#   !! The SPEC's 6-12 month target is NOT met by this board as shipped. To be
#      measured in P3.1 and resolved in Phase 3 (design out LDO + USB-UART + LED).
#
# P0.1 scope: render a 7-colour test pattern on the bare panel from ESPHome.
# ============================================================================

substitutions:
  device_name: epaper-art-frame
  friendly_name: E-Paper Art Frame

  # Pin map — see header. P0.2 replaces the board + confirms these.
  clk_pin: GPIO12
  mosi_pin: GPIO11
  cs_pin: GPIO10
  dc_pin: GPIO9
  reset_pin: GPIO8
  busy_pin: GPIO7

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - delay: 2s
      - component.update: epaper_display

esp32:
  # Heemol ESP32-S3 N16R8 (DevKitC-1 form factor, ESP32-S3-WROOM-1-N16R8).
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: ${clk_pin}
  mosi_pin: ${mosi_pin}

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 5.65in-f
    cs_pin: ${cs_pin}
    dc_pin: ${dc_pin}
    reset_pin: ${reset_pin}
    busy_pin: ${busy_pin}
    # Rendered once from on_boot for the P0.1 bench test.
    update_interval: never
    lambda: |-
      const int W = 600;
      const int H = 448;

      // 7 ACeP565 colours, ordered to exercise every colour code in
      // waveshare_epaper's 7-colour path (0x0..0x6).
      const Color bars[7] = {
        Color(0, 0, 0),        // 0x0 black
        Color(0, 0, 255),      // 0x3 blue
        Color(0, 255, 0),      // 0x2 green
        Color(255, 255, 0),    // 0x5 yellow
        Color(255, 128, 0),    // 0x6 orange
        Color(255, 0, 0),      // 0x4 red
        Color(255, 255, 255),  // 0x1 white
      };

      it.fill(Color(255, 255, 255));

      // 7 vertical colour bars.
      const int bar_w = W / 7;
      for (int i = 0; i < 7; i++) {
        it.filled_rectangle(i * bar_w, 60, bar_w, 328, bars[i]);
      }

      // Geometry marks: full border, corner blocks, both diagonals.
      it.rectangle(0, 0, W, H, Color(0, 0, 0));
      it.filled_rectangle(0, 0, 24, 24, Color(0, 0, 0));
      it.filled_rectangle(W - 24, 0, 24, 24, Color(0, 0, 0));
      it.filled_rectangle(0, H - 24, 24, 24, Color(0, 0, 0));
      it.filled_rectangle(W - 24, H - 24, 24, 24, Color(0, 0, 0));
      it.line(0, 0, W - 1, H - 1, Color(0, 0, 0));
      it.line(W - 1, 0, 0, H - 1, Color(0, 0, 0));
